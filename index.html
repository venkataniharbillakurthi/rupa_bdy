<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Happy Birthday Rupa 🎈</title>
  <meta name="description" content="A birthday film for Rupa, from a friend: a floating balloon you open with a tap, a rush of colour, and a tree that blooms with flowers and leaves." />
  <meta name="theme-color" content="#f7e7dc" />
  <link rel="icon" type="image/png" href="/favicon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,900&display=swap" rel="stylesheet" />

  <script>document.documentElement.classList.add('js')</script>
  <link rel="stylesheet" href="./birthday.css" />
</head>
<body>
  <main class="scene">

    <!-- The tree world (Act 4). One canvas; it stays transparent until the
         intro hands off, then it draws its own warm sky + blossom tree. -->
    <canvas id="tree" class="tree" aria-label="A tree grows and blooms with flowers and leaves" role="img"></canvas>

    <!-- ACT 1 — THE INVITATION ------------------------------------------------
         A single floating balloon on a warm field. It is the only thing the
         visitor has to do: tap it. Real <button> so it is tappable + keyboard
         focusable; everything decorative around it is aria-hidden. -->
    <section class="hero" id="hero" aria-label="Draw the bow to open your card">
      <div class="hero__bg" aria-hidden="true"></div>
      <div class="hero__motes" id="motes" aria-hidden="true"></div>

      <p class="hero__eyebrow" id="eyebrow">hey Rupa - this is for you</p>

      <div class="hero__deco" id="heroDeco" aria-hidden="true">
        <svg class="deco-defs" aria-hidden="true">
          <defs>
            <radialGradient id="petCoral" cx="50%" cy="78%" r="78%"><stop offset="0%" stop-color="#fff4ea"/><stop offset="48%" stop-color="#ff8fa3"/><stop offset="100%" stop-color="#c94a66"/></radialGradient>
            <radialGradient id="petGold" cx="50%" cy="78%" r="78%"><stop offset="0%" stop-color="#fff6d8"/><stop offset="48%" stop-color="#f0b43c"/><stop offset="100%" stop-color="#c48a14"/></radialGradient>
            <radialGradient id="petPeach" cx="50%" cy="78%" r="78%"><stop offset="0%" stop-color="#ffe8d4"/><stop offset="48%" stop-color="#ff7a58"/><stop offset="100%" stop-color="#d44a28"/></radialGradient>
            <radialGradient id="petPink" cx="50%" cy="78%" r="78%"><stop offset="0%" stop-color="#ffe6f2"/><stop offset="48%" stop-color="#e86aad"/><stop offset="100%" stop-color="#b84480"/></radialGradient>
            <radialGradient id="seed" cx="38%" cy="38%" r="62%"><stop offset="0%" stop-color="#fff8d2"/><stop offset="100%" stop-color="#e8a23d"/></radialGradient>
            <linearGradient id="leafFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#d8f0c4"/><stop offset="55%" stop-color="#5aaa48"/><stop offset="100%" stop-color="#2f7a32"/></linearGradient>
            <linearGradient id="leafFill2" x1="1" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#c4e4a8"/><stop offset="60%" stop-color="#3d8c38"/><stop offset="100%" stop-color="#2a6828"/></linearGradient>
            <radialGradient id="sbA" cx="36%" cy="26%" r="72%"><stop offset="0%" stop-color="#fff6d8"/><stop offset="38%" stop-color="#f0b43c"/><stop offset="78%" stop-color="#d49218"/><stop offset="100%" stop-color="#a87010"/></radialGradient>
            <radialGradient id="sbB" cx="36%" cy="26%" r="72%"><stop offset="0%" stop-color="#ffe6f2"/><stop offset="38%" stop-color="#e86aad"/><stop offset="78%" stop-color="#c44a88"/><stop offset="100%" stop-color="#8a3060"/></radialGradient>
            <radialGradient id="sbC" cx="36%" cy="26%" r="72%"><stop offset="0%" stop-color="#e8f8ff"/><stop offset="38%" stop-color="#4db8e8"/><stop offset="78%" stop-color="#2a86b8"/><stop offset="100%" stop-color="#1a5a80"/></radialGradient>
            <linearGradient id="sbSheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="rgba(255,255,255,.85)"/><stop offset="34%" stop-color="rgba(255,255,255,0)"/></linearGradient>
          </defs>
          <g id="fl-coral">
            <path fill="url(#petCoral)" d="M0,2 C7.8,-9 9.8,-21 0,-29 C-9.8,-21 -7.8,-9 0,2Z"/>
            <path fill="url(#petCoral)" d="M0,2 C7.8,-9 9.8,-21 0,-29 C-9.8,-21 -7.8,-9 0,2Z" transform="rotate(72)"/>
            <path fill="url(#petCoral)" d="M0,2 C7.8,-9 9.8,-21 0,-29 C-9.8,-21 -7.8,-9 0,2Z" transform="rotate(144)"/>
            <path fill="url(#petCoral)" d="M0,2 C7.8,-9 9.8,-21 0,-29 C-9.8,-21 -7.8,-9 0,2Z" transform="rotate(216)"/>
            <path fill="url(#petCoral)" d="M0,2 C7.8,-9 9.8,-21 0,-29 C-9.8,-21 -7.8,-9 0,2Z" transform="rotate(288)"/>
            <circle r="4.8" fill="url(#seed)"/>
          </g>
          <g id="fl-gold">
            <path fill="url(#petGold)" d="M0,2 C7.8,-9 9.8,-21 0,-29 C-9.8,-21 -7.8,-9 0,2Z"/>
            <path fill="url(#petGold)" d="M0,2 C7.8,-9 9.8,-21 0,-29 C-9.8,-21 -7.8,-9 0,2Z" transform="rotate(72)"/>
            <path fill="url(#petGold)" d="M0,2 C7.8,-9 9.8,-21 0,-29 C-9.8,-21 -7.8,-9 0,2Z" transform="rotate(144)"/>
            <path fill="url(#petGold)" d="M0,2 C7.8,-9 9.8,-21 0,-29 C-9.8,-21 -7.8,-9 0,2Z" transform="rotate(216)"/>
            <path fill="url(#petGold)" d="M0,2 C7.8,-9 9.8,-21 0,-29 C-9.8,-21 -7.8,-9 0,2Z" transform="rotate(288)"/>
            <circle r="4.8" fill="url(#seed)"/>
          </g>
          <g id="fl-peach">
            <path fill="url(#petPeach)" d="M0,2 C7.8,-9 9.8,-21 0,-29 C-9.8,-21 -7.8,-9 0,2Z"/>
            <path fill="url(#petPeach)" d="M0,2 C7.8,-9 9.8,-21 0,-29 C-9.8,-21 -7.8,-9 0,2Z" transform="rotate(72)"/>
            <path fill="url(#petPeach)" d="M0,2 C7.8,-9 9.8,-21 0,-29 C-9.8,-21 -7.8,-9 0,2Z" transform="rotate(144)"/>
            <path fill="url(#petPeach)" d="M0,2 C7.8,-9 9.8,-21 0,-29 C-9.8,-21 -7.8,-9 0,2Z" transform="rotate(216)"/>
            <path fill="url(#petPeach)" d="M0,2 C7.8,-9 9.8,-21 0,-29 C-9.8,-21 -7.8,-9 0,2Z" transform="rotate(288)"/>
            <circle r="4.8" fill="url(#seed)"/>
          </g>
          <g id="fl-pink">
            <path fill="url(#petPink)" d="M0,2 C7.8,-9 9.8,-21 0,-29 C-9.8,-21 -7.8,-9 0,2Z"/>
            <path fill="url(#petPink)" d="M0,2 C7.8,-9 9.8,-21 0,-29 C-9.8,-21 -7.8,-9 0,2Z" transform="rotate(72)"/>
            <path fill="url(#petPink)" d="M0,2 C7.8,-9 9.8,-21 0,-29 C-9.8,-21 -7.8,-9 0,2Z" transform="rotate(144)"/>
            <path fill="url(#petPink)" d="M0,2 C7.8,-9 9.8,-21 0,-29 C-9.8,-21 -7.8,-9 0,2Z" transform="rotate(216)"/>
            <path fill="url(#petPink)" d="M0,2 C7.8,-9 9.8,-21 0,-29 C-9.8,-21 -7.8,-9 0,2Z" transform="rotate(288)"/>
            <circle r="4.8" fill="url(#seed)"/>
          </g>
          <g id="leaf">
            <path fill="url(#leafFill)" d="M0,0 C12,-16 14,-38 0,-52 C-14,-38 -12,-16 0,0Z"/>
            <path d="M0,-4 L0,-46" fill="none" stroke="rgba(40,80,24,.4)" stroke-width="1.2" stroke-linecap="round"/>
            <path d="M0,-16 Q8,-21 7,-28 M0,-28 Q-7.5,-33 -6.5,-40" fill="none" stroke="rgba(40,80,24,.28)" stroke-width=".8" stroke-linecap="round"/>
          </g>
          <g id="leaf2">
            <path fill="url(#leafFill2)" d="M0,0 C12,-16 14,-38 0,-52 C-14,-38 -12,-16 0,0Z"/>
            <path d="M0,-4 L0,-46" fill="none" stroke="rgba(40,80,24,.4)" stroke-width="1.2" stroke-linecap="round"/>
            <path d="M0,-16 Q8,-21 7,-28 M0,-28 Q-7.5,-33 -6.5,-40" fill="none" stroke="rgba(40,80,24,.28)" stroke-width=".8" stroke-linecap="round"/>
          </g>
        </svg>
        <svg class="garland" viewBox="0 0 900 110" preserveAspectRatio="xMidYMin meet">
          <path d="M30 62 C 140 92, 250 28, 360 58 S 560 96, 680 50 S 820 28, 870 48" fill="none" stroke="#4a8a3a" stroke-width="2.6" stroke-linecap="round"/>
          <use href="#leaf" transform="translate(88,78) rotate(-118) scale(0.72)"/>
          <use href="#leaf2" transform="translate(168,46) rotate(62) scale(0.64)"/>
          <use href="#leaf" transform="translate(268,78) rotate(-108) scale(0.7)"/>
          <use href="#leaf2" transform="translate(372,52) rotate(70) scale(0.66)"/>
          <use href="#leaf" transform="translate(488,86) rotate(-112) scale(0.7)"/>
          <use href="#leaf2" transform="translate(598,58) rotate(58) scale(0.64)"/>
          <use href="#leaf" transform="translate(708,70) rotate(-100) scale(0.68)"/>
          <use href="#leaf2" transform="translate(798,46) rotate(64) scale(0.6)"/>
          <use href="#fl-peach" transform="translate(92,58) rotate(-12) scale(0.9)"/>
          <use href="#fl-gold" transform="translate(176,40) rotate(18) scale(0.78)"/>
          <use href="#fl-coral" transform="translate(274,64) rotate(-8) scale(0.92)"/>
          <use href="#fl-pink" transform="translate(368,44) rotate(14) scale(0.8)"/>
          <use href="#fl-gold" transform="translate(486,72) rotate(-16) scale(0.94)"/>
          <use href="#fl-peach" transform="translate(590,48) rotate(10) scale(0.76)"/>
          <use href="#fl-coral" transform="translate(704,56) rotate(-6) scale(0.88)"/>
          <use href="#fl-pink" transform="translate(800,40) rotate(12) scale(0.74)"/>
        </svg>
        <svg class="deco deco--tl" viewBox="0 0 220 220">
          <use href="#leaf" transform="translate(58,168) rotate(-38) scale(1.35)"/>
          <use href="#leaf2" transform="translate(118,176) rotate(18) scale(1.15)"/>
          <use href="#leaf" transform="translate(168,132) rotate(58) scale(1.05)"/>
          <use href="#fl-coral" transform="translate(86,92) rotate(-8) scale(1.55)"/>
          <use href="#fl-gold" transform="translate(148,78) rotate(16) scale(1.2)"/>
          <use href="#fl-peach" transform="translate(54,128) rotate(-22) scale(1.05)"/>
          <use href="#fl-pink" transform="translate(132,134) rotate(10) scale(0.92)"/>
        </svg>
        <svg class="deco deco--tr" viewBox="0 0 220 220">
          <use href="#leaf2" transform="translate(162,168) rotate(38) scale(1.35)"/>
          <use href="#leaf" transform="translate(102,176) rotate(-18) scale(1.15)"/>
          <use href="#leaf2" transform="translate(52,132) rotate(-58) scale(1.05)"/>
          <use href="#fl-pink" transform="translate(134,92) rotate(8) scale(1.55)"/>
          <use href="#fl-peach" transform="translate(72,78) rotate(-16) scale(1.2)"/>
          <use href="#fl-gold" transform="translate(166,128) rotate(22) scale(1.05)"/>
          <use href="#fl-coral" transform="translate(88,134) rotate(-10) scale(0.92)"/>
        </svg>
        <svg class="deco deco--br" viewBox="0 0 200 200">
          <use href="#leaf" transform="translate(70,150) rotate(-28) scale(1.15)"/>
          <use href="#leaf2" transform="translate(140,136) rotate(42) scale(1)"/>
          <use href="#fl-peach" transform="translate(96,88) rotate(-10) scale(1.35)"/>
          <use href="#fl-gold" transform="translate(148,78) rotate(18) scale(1.05)"/>
          <use href="#fl-coral" transform="translate(58,108) rotate(-20) scale(0.95)"/>
        </svg>
        <svg class="side-balloon side-balloon--a" viewBox="0 0 100 148">
          <path d="M50 6C27 6 11 25 11 48c0 21 14 40 39 52 25-12 39-31 39-52C89 25 73 6 50 6Z" fill="url(#sbA)"/>
          <path d="M50 6C27 6 11 25 11 48c0 21 14 40 39 52 25-12 39-31 39-52C89 25 73 6 50 6Z" fill="url(#sbSheen)" opacity=".7"/>
          <ellipse cx="36" cy="36" rx="10" ry="16" fill="#fff" opacity=".72" style="mix-blend-mode:screen"/>
          <path d="M45 98 L50 111 L55 98 Z" fill="#c48a14"/>
          <path d="M50 110 C46 118 55 124 50 132 C47 138 54 142 50 146" fill="none" stroke="#c9a25a" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <svg class="side-balloon side-balloon--b" viewBox="0 0 100 148">
          <path d="M50 6C27 6 11 25 11 48c0 21 14 40 39 52 25-12 39-31 39-52C89 25 73 6 50 6Z" fill="url(#sbB)"/>
          <path d="M50 6C27 6 11 25 11 48c0 21 14 40 39 52 25-12 39-31 39-52C89 25 73 6 50 6Z" fill="url(#sbSheen)" opacity=".7"/>
          <ellipse cx="36" cy="36" rx="10" ry="16" fill="#fff" opacity=".72" style="mix-blend-mode:screen"/>
          <path d="M45 98 L50 111 L55 98 Z" fill="#b84480"/>
          <path d="M50 110 C46 118 55 124 50 132 C47 138 54 142 50 146" fill="none" stroke="#c9a25a" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <svg class="side-balloon side-balloon--c" viewBox="0 0 100 148">
          <path d="M50 6C27 6 11 25 11 48c0 21 14 40 39 52 25-12 39-31 39-52C89 25 73 6 50 6Z" fill="url(#sbC)"/>
          <path d="M50 6C27 6 11 25 11 48c0 21 14 40 39 52 25-12 39-31 39-52C89 25 73 6 50 6Z" fill="url(#sbSheen)" opacity=".7"/>
          <ellipse cx="36" cy="36" rx="10" ry="16" fill="#fff" opacity=".72" style="mix-blend-mode:screen"/>
          <path d="M45 98 L50 111 L55 98 Z" fill="#1a5a80"/>
          <path d="M50 110 C46 118 55 124 50 132 C47 138 54 142 50 146" fill="none" stroke="#c9a25a" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </div>

      <!-- THE TARGET — the balloon the arrow flies to (GSAP animates .target) -->
      <div class="targetWrap" aria-hidden="true">
        <div class="target" id="target">
          <span class="heart__glow" aria-hidden="true"></span>
          <span class="target__heart" id="targetHeart">
            <svg class="heart__svg" viewBox="0 0 100 128" aria-hidden="true">
              <defs>
                <radialGradient id="hg" cx="36%" cy="26%" r="72%">
                  <stop offset="0%"  stop-color="#ffe9c8" />
                  <stop offset="38%" stop-color="#ff8a4a" />
                  <stop offset="78%" stop-color="#ff5a32" />
                  <stop offset="100%" stop-color="#d63a1e" />
                </radialGradient>
                <linearGradient id="hsheen" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%"  stop-color="rgba(255,255,255,.85)" />
                  <stop offset="34%" stop-color="rgba(255,255,255,0)" />
                </linearGradient>
              </defs>
              <path d="M50 6C27 6 11 25 11 48c0 21 14 40 39 52 25-12 39-31 39-52C89 25 73 6 50 6Z" fill="url(#hg)" />
              <path d="M50 6C27 6 11 25 11 48c0 21 14 40 39 52 25-12 39-31 39-52C89 25 73 6 50 6Z" fill="url(#hsheen)" opacity=".7" />
              <ellipse cx="36" cy="36" rx="10" ry="16" fill="#fff" opacity=".72" style="mix-blend-mode:screen" />
              <path d="M45 98 L50 111 L55 98 Z" fill="#e24a28" />
              <path d="M50 110 C46 116 55 121 50 126" fill="none" stroke="#c9a25a" stroke-width="1.7" stroke-linecap="round" />
            </svg>
          </span>
        </div>
      </div>

      <!-- THE BOW + ARROW — draw the string back, release to fire. The rig is
           placed lower-left and rotated by JS to aim at the balloon, so the shot
           travels on a diagonal. A real control: role=button + keyboard drag. -->
      <div class="archery" id="archery" role="button" tabindex="0"
           aria-label="Draw the bow and release to send the arrow to the balloon">

          <!-- aim line, inside the rig so it points straight at the balloon -->
          <div class="aim" id="aim" aria-hidden="true"></div>

          <!-- realistic recurve bow: wooden limbs, leather grip, a live string -->
          <svg class="bow" id="bow" viewBox="0 0 460 300" aria-hidden="true">
            <defs>
              <linearGradient id="limb" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0"   stop-color="#4a2a1a" />
                <stop offset=".18" stop-color="#6b3f24" />
                <stop offset=".5"  stop-color="#8a5127" />
                <stop offset=".82" stop-color="#6b3f24" />
                <stop offset="1"   stop-color="#4a2a1a" />
              </linearGradient>
              <linearGradient id="limbHi" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="rgba(255,214,160,.8)" />
                <stop offset="1" stop-color="rgba(255,214,160,0)" />
              </linearGradient>
              <linearGradient id="grip" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#2a1a10" />
                <stop offset=".5" stop-color="#5a3822" />
                <stop offset="1" stop-color="#2a1a10" />
              </linearGradient>
            </defs>
            <!-- limb body (taper faked with two stacked strokes) -->
            <path class="bow__limb" d="M34 96 C 118 168, 168 240, 230 252 C 292 240, 342 168, 426 96"
                  fill="none" stroke="url(#limb)" stroke-width="13" stroke-linecap="round" />
            <path class="bow__limbHi" d="M34 96 C 118 168, 168 240, 230 252 C 292 240, 342 168, 426 96"
                  fill="none" stroke="url(#limbHi)" stroke-width="3" stroke-linecap="round" opacity=".7" />
            <!-- recurve tip hooks -->
            <path d="M34 96 C 22 82, 26 70, 40 66" fill="none" stroke="url(#limb)" stroke-width="8" stroke-linecap="round" />
            <path d="M426 96 C 438 82, 434 70, 420 66" fill="none" stroke="url(#limb)" stroke-width="8" stroke-linecap="round" />
            <!-- leather grip over the belly -->
            <rect x="216" y="206" width="28" height="70" rx="9" fill="url(#grip)" />
            <path d="M219 220h22 M219 236h22 M219 252h22" stroke="rgba(0,0,0,.35)" stroke-width="2" />
            <!-- the string: two segments meeting at the nock (JS animates the nock).
                 A warm taupe so the taut string actually reads against the cream. -->
            <line class="bow__str" id="strL" x1="40" y1="70" x2="230" y2="96" stroke="#9a8068" stroke-width="2.2" stroke-linecap="round" />
            <line class="bow__str" id="strR" x1="420" y1="70" x2="230" y2="96" stroke="#9a8068" stroke-width="2.2" stroke-linecap="round" />
            <circle class="bow__serving" id="serving" cx="230" cy="96" r="4.5" fill="#6f5137" />
          </svg>

          <!-- the arrow: winged golden tip, gold feather fletching -->
          <svg class="arrow" id="arrow" viewBox="0 0 64 220" aria-hidden="true">
            <defs>
              <linearGradient id="shaft" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#4a2c14" />
                <stop offset=".5" stop-color="#8a5a2c" />
                <stop offset="1" stop-color="#3e2410" />
              </linearGradient>
              <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#ffe38c" />
                <stop offset=".45" stop-color="#f4a626" />
                <stop offset="1" stop-color="#a85f0e" />
              </linearGradient>
              <linearGradient id="feath" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#ffb14a" />
                <stop offset=".5" stop-color="#ff6b3a" />
                <stop offset="1" stop-color="#d94a22" />
              </linearGradient>
              <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#ffffff" />
                <stop offset="1" stop-color="#ffe0c4" />
              </linearGradient>
            </defs>

            <!-- shaft (dark wood so it reads against the cream) -->
            <rect x="29.4" y="30" width="5.2" height="168" rx="2.6" fill="url(#shaft)" />

            <!-- angel wings flanking the tip -->
            <g class="arrow__wings">
              <path class="wingL" d="M31 30 C 10 16, 2 20, 4 34 C 12 30, 20 32, 31 40 Z" fill="url(#wing)" stroke="rgba(196,132,58,.72)" stroke-width="1.2"/>
              <path class="wingR" d="M33 30 C 54 16, 62 20, 60 34 C 52 30, 44 32, 33 40 Z" fill="url(#wing)" stroke="rgba(196,132,58,.72)" stroke-width="1.2"/>
            </g>

            <!-- golden triangular arrowhead -->
            <path class="arrow__head" d="M32 8 L44 28 L32 23 L20 28 Z" fill="url(#gold)" stroke="#a5701a" stroke-width=".8" stroke-linejoin="round" />
            <ellipse cx="32" cy="16" rx="2.2" ry="1.4" fill="#fff" opacity=".7" style="mix-blend-mode:screen" />

            <!-- gold feather fletching -->
            <g class="arrow__fletch">
              <path d="M32 150 C 16 156, 10 178, 15 200 C 24 194, 30 184, 32 176 Z" fill="url(#feath)" />
              <path d="M32 150 C 48 156, 54 178, 49 200 C 40 194, 34 184, 32 176 Z" fill="url(#feath)" opacity=".92" />
              <path d="M28 160l4 3 M26 170l6 3 M25 180l7 3" stroke="rgba(140,50,12,.45)" stroke-width="1" />
              <path d="M36 160l-4 3 M38 170l-6 3 M39 180l-7 3" stroke="rgba(140,50,12,.45)" stroke-width="1" />
            </g>
            <!-- nock -->
            <path d="M29 200 L32 205 L35 200" fill="none" stroke="#c9a25a" stroke-width="2" stroke-linecap="round"/>
            <!-- invisible tip marker: JS measures it to land the head on the balloon -->
            <circle id="tip" cx="32" cy="9" r="0.6" fill="none" />
          </svg>
      </div>

      <p class="hero__hint" id="hint">pull &amp; release</p>
    </section>

    <!-- ACT 2 — THE FLOOD -----------------------------------------------------
         The balloon bursts into this circle at its landing point, and it swallows
         the frame in rose. Same trick as the intro dot: no cross-fade anywhere,
         the colour just arrives. -->
    <div class="flood" id="flood" aria-hidden="true"></div>

    <!-- ACT 3 — THE WISH (kinetic type on the flood) --------------------------
         Lives inside the flood's own colour, revealed by it. Every glyph hinges
         up out of its mask — nothing fades. -->
    <div class="field" id="field" aria-hidden="true">
      <div class="blob blob--1"></div>
      <div class="blob blob--2"></div>
      <div class="blob blob--3"></div>
      <div class="fgrid" id="fgrid"></div>
      <div class="fvignette"></div>

      <div class="camera" id="camera">
        <p class="kEyebrow" id="kEyebrow">from a friend&hellip;</p>
        <h2 class="headline" id="headline">
          <span class="hl__line">
            <span class="hl__word hl__word--sm" id="wLine1">Happy Birthday</span>
            <span class="hl__word hl__word--name" id="wLine2">RUPA</span>
          </span>
        </h2>
        <svg class="uline" id="uline" viewBox="0 0 300 26" fill="none" aria-hidden="true">
          <path class="uline__path" d="M8 16C56 7 132 4 178 6c30 1 78 5 114 12-40 3-108 4-176 3"
                stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <p class="kSub" id="kSub">cheers to you, always</p>
      </div>

      <div class="bar bar--top" id="barTop"></div>
      <div class="bar bar--bot" id="barBot"></div>
    </div>

    <!-- The gold light that bridges the rose wish into the dawn of the tree. -->
    <div class="bloom" id="bloom" aria-hidden="true"></div>

    <!-- ACT 4 — THE HAND-LETTERED WISH (over the tree) ------------------------ -->
    <div class="wish" id="wish" aria-hidden="true">
      <p class="wish__eyebrow" id="wEyebrow">so&hellip; here&rsquo;s to you</p>
      <div class="wish__heroWrap"><h1 class="wish__hero" id="wHero">Happy Birthday <span class="wish__name">Rupa</span></h1></div>
      <span class="wish__rule" id="wRule"></span>
      <p class="wish__sub" id="wSub">here&rsquo;s to more laughs this year</p>
    </div>

    <!-- Play the film again once it has settled. -->
    <button class="replay" id="replay" type="button" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true" width="15" height="15">
        <path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z" fill="currentColor" />
      </svg>
      Again
    </button>

    <!-- One lens over the whole film: vignette + fine grain. -->
    <div class="grade" aria-hidden="true">
      <div class="grade__vignette"></div>
      <div class="grade__grain"></div>
    </div>
  </main>

  <!-- Accessible equivalent for reduced-motion + screen readers. -->
  <p class="sr-only">Happy Birthday Rupa. Here&rsquo;s to more laughs this year, from a friend.</p>

  <script type="module" src="./birthday.js"></script>
</body>
</html>
